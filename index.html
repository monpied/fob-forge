<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>fob Forge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: one-screen workbench. Item list | leyline canvas (shop-style trees: finished item on top, components below) | inspector. */
:root{
  --bg:#12111c; --panel:#1a1927; --panel-2:#222133; --line:#33314a; --line-2:#45425f;
  --fg:#ebe8f4; --muted:#9b97b2; --faint:#6d6a86;
  --mana:#6ec3ff; --mana-soft:rgba(110,195,255,.16);
  --gold:#e8c060; --danger:#ef7070; --ok:#7fd6a4;
  --t-comp:#8e9ab4; --t-adv:#5fb0f4; --t-leg:#e89a4e;
  --grid:rgba(155,151,178,.16);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --f-display:"Marcellus SC","Cinzel",Georgia,serif;
  --f-ui:"Barlow Semi Condensed","Barlow","Segoe UI",system-ui,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eceef5; --panel:#ffffff; --panel-2:#f3f4f9; --line:#d5d7e3; --line-2:#bfc2d3;
  --fg:#1b1a28; --muted:#5d5f76; --faint:#8a8ca0;
  --mana:#1c7dd0; --mana-soft:rgba(28,125,208,.12);
  --gold:#9c7112; --danger:#c43c3c; --ok:#1f8a52;
  --t-comp:#66728c; --t-adv:#1c7dd0; --t-leg:#c56a12;
  --grid:rgba(60,62,90,.14); --shadow:0 10px 26px rgba(30,30,60,.14);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#eceef5; --panel:#ffffff; --panel-2:#f3f4f9; --line:#d5d7e3; --line-2:#bfc2d3;
  --fg:#1b1a28; --muted:#5d5f76; --faint:#8a8ca0;
  --mana:#1c7dd0; --mana-soft:rgba(28,125,208,.12);
  --gold:#9c7112; --danger:#c43c3c; --ok:#1f8a52;
  --t-comp:#66728c; --t-adv:#1c7dd0; --t-leg:#c56a12;
  --grid:rgba(60,62,90,.14); --shadow:0 10px 26px rgba(30,30,60,.14);
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--mana);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.04em;white-space:nowrap}
.brand .count{font-family:var(--f-ui);color:var(--muted);font-size:13px;white-space:nowrap}
.status{font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.live::before{background:var(--ok)} .status.warn::before{background:var(--gold)} .status.ro::before{background:var(--danger)}
.btn{font-family:var(--f-ui);font-weight:600;font-size:14px;letter-spacing:.02em;border:1px solid var(--line-2);background:var(--panel-2);border-radius:7px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--mana)}
.btn.primary{background:var(--mana);border-color:var(--mana);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.sm{font-size:13px;padding:4px 9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:32px;height:32px;padding:0;justify-content:center}

.work{display:grid;grid-template-columns:280px 1fr 340px;min-height:0;position:relative}
.side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side .search{padding:10px}
.field,.side input[type=search]{width:100%;box-sizing:border-box;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
.field:focus,.side input:focus{border-color:var(--mana);outline:none}
.list{overflow:auto;padding:0 6px 12px;flex:1}
.group-h{font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px;display:flex;justify-content:space-between}
.li{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:7px;padding:5px 6px}
.li:hover{background:var(--panel-2)}
.li.sel{border-color:var(--mana);background:var(--mana-soft)}
.li .eff{font-size:10.5px;line-height:14px}
.li .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-ui);font-weight:600}
.gold{font-family:var(--f-ui);font-variant-numeric:tabular-nums;color:var(--gold);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.gold::before{content:"";width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c8,var(--gold) 60%);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 60%,transparent)}

.mono-tile{display:grid;place-items:center;font-family:var(--f-display);color:var(--fg);border-radius:4px;flex:none;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 55%,var(--panel-2)),color-mix(in srgb,var(--tc) 15%,var(--panel-2)));border:1px solid color-mix(in srgb,var(--tc) 60%,transparent)}
.mono-tile img{width:100%;height:100%;object-fit:cover;display:block}
.tier-component{--tc:var(--t-comp)} .tier-advanced{--tc:var(--t-adv)} .tier-legendary{--tc:var(--t-leg)}

/* canvas */
.stage{position:relative;overflow:hidden;min-width:0;touch-action:none;cursor:grab;
  background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.3px);background-size:24px 24px}
.stage.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.edges path.e{fill:none;stroke:var(--mana);stroke-width:2;opacity:.6;pointer-events:stroke;cursor:pointer}
.edges path.hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.edges path.e.sel{opacity:1;stroke-width:3;stroke:var(--gold)}
.edges path.e.dim{opacity:.18}
.edges path.temp{fill:none;stroke:var(--mana);stroke-width:2;stroke-dasharray:6 5}
.edges .qty rect{fill:var(--mana)} .edges .qty text{font-family:var(--f-ui);font-weight:700;font-size:12px;fill:var(--bg);text-anchor:middle;dominant-baseline:central}
.node{position:absolute;left:0;top:0;width:184px;background:var(--panel);border:1px solid var(--line-2);border-radius:9px;box-shadow:var(--shadow);cursor:pointer;user-select:none;-webkit-user-select:none}
.node::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;border-radius:9px 9px 0 0;background:var(--tc)}
.node.sel{border-color:var(--mana);box-shadow:0 0 0 2px var(--mana-soft),var(--shadow)}
.node.dim{opacity:.38}
.node .n-head{display:flex;gap:9px;padding:11px 10px 8px;align-items:center}
.node .n-name{font-family:var(--f-ui);font-weight:700;font-size:15px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.node .n-sub{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:3px;font-size:12px}
.node .n-sub small{color:var(--muted);font-family:var(--f-ui)}
.node ul{list-style:none;margin:0;padding:0 10px 8px;display:grid;gap:1px;font-family:var(--f-ui);font-size:13px;color:var(--muted)}
.node ul b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.node .n-fx{border-top:1px solid var(--line);padding:6px 10px;font-family:var(--f-ui);font-size:12px;color:var(--muted);display:grid;gap:2px}
.node .n-fx span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .n-fx em{font-style:normal;color:var(--tc);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:10.5px;margin-right:5px}
.port{position:absolute;left:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--mana);box-sizing:border-box;cursor:crosshair;z-index:2}
.port::after{content:"";position:absolute;inset:-9px}
.port.in{bottom:-8px} .port.out{top:-8px}
.port.out:hover,.port.in.drop{background:var(--mana)}
.ro .port{display:none}
.eff{font-family:var(--f-ui);font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 5px;border-radius:4px;border:1px solid currentColor;line-height:16px}
.eff.ok{color:var(--ok)} .eff.over{color:var(--gold)} .eff.under{color:var(--danger)}
.tier-tag{font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 55%,transparent);background:color-mix(in srgb,var(--tc) 14%,transparent);border-radius:4px;padding:0 5px;line-height:16px}
.efft,.goldt{width:100%;border-collapse:collapse;font-family:var(--f-ui);font-size:13px;font-variant-numeric:tabular-nums}
.efft td{padding:3px 0;border-bottom:1px solid var(--line)} .efft td:nth-child(2){color:var(--muted)} .efft td:last-child{text-align:right}
.efft tr.tot td{border-bottom:0;font-weight:700;color:var(--fg)}
.goldt{min-width:520px} .goldt th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.goldt td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line)} .goldt td:last-child{width:120px}
.sub-h{margin:4px 0 0;font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bands{display:flex;flex-wrap:wrap;gap:10px}
.band{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.band input{width:64px;text-align:right}
.side-foot{padding:10px;border-top:1px solid var(--line);background:var(--panel);padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.side-foot .btn{width:100%;justify-content:center;padding-block:9px}
.li.open{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent)}
.li .nm small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.crumbs{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:12px;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:9px;padding:5px 12px 5px 6px;max-width:calc(100% - 24px)}
.crumb-k{font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-left:6px}
.crumb-n{font-family:var(--f-display);font-size:18px;color:var(--fg);border-bottom:2px solid var(--tc)}
.node.root{border-color:var(--tc);box-shadow:0 0 0 1px var(--tc),var(--shadow)}
.node.root.sel{box-shadow:0 0 0 2px var(--mana),var(--shadow)}
.n-foot{display:flex;border-top:1px dashed var(--line-2)}
.n-foot button{flex:1;border:0;background:transparent;padding:6px 10px;font-family:var(--f-ui);font-size:12px;font-weight:600;color:var(--mana);text-align:left}
.n-foot button+button{flex:none;border-left:1px dashed var(--line-2);color:var(--muted)}
.n-foot button:hover{background:var(--mana-soft);color:var(--fg)}
.n-foot button:first-child{border-bottom-left-radius:9px} .n-foot button:last-child{border-bottom-right-radius:9px}
.port{cursor:default;pointer-events:none}
.relbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg-sm{grid-template-columns:auto auto;width:auto}
.seg-sm button{padding:4px 10px;font-size:12.5px}
.seg-sm button.on{background:var(--mana-soft);box-shadow:inset 0 -2px 0 var(--mana)}
.seg-sm button[disabled]{opacity:.45;cursor:not-allowed}
ul.chg{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-family:var(--f-ui);font-size:13.5px;line-height:1.4}
ul.chg li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font-family:var(--f-ui);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:1px 6px;flex:none;border:1px solid currentColor}
.tag.add{color:var(--ok)} .tag.chg2{color:var(--gold)} .tag.rm{color:var(--danger)}
.rel{display:grid;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.rel:last-child{border-bottom:0}
.rel-h{display:flex;align-items:baseline;gap:10px;font-family:var(--f-ui)}
.rel-v{font-family:var(--f-display);font-size:20px}
.rel-notes{margin:0;line-height:1.5;max-width:65ch}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px;line-height:1.5;max-width:64ch}
.sel{font-family:var(--f-mono);font-size:12.5px;user-select:all;background:var(--panel-2);padding:0 4px;border-radius:4px}
.linkbtn{background:none;border:0;padding:0;color:var(--mana);text-decoration:underline;text-underline-offset:3px;font:inherit}
.gh-msg{margin:0;padding:8px 12px;border-radius:8px;background:color-mix(in srgb,var(--gold) 14%,var(--panel));border:1px solid var(--line);font-family:var(--f-ui)}
.conf{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:9px}
.conf-h{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-family:var(--f-ui)}
.conf-o{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:7px;background:var(--panel-2);cursor:pointer}
.conf-o span{display:grid;font-family:var(--f-ui)} .conf-o small{color:var(--muted)}
.list-hint{margin:2px 8px 0;font-family:var(--f-ui);font-size:12px;color:var(--faint)}
.li{touch-action:pan-y;cursor:grab}
.li .on-graph{font-family:var(--f-ui);font-size:11px;font-weight:700;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:0 6px;line-height:16px;font-variant-numeric:tabular-nums}
body.dragging-item,body.dragging-item *{cursor:grabbing!important;user-select:none}
.drag-ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--mana);border-radius:8px;padding:5px 10px 5px 6px;box-shadow:var(--shadow);font-family:var(--f-ui);font-weight:700}
.node.drop-target{border-color:var(--mana);box-shadow:0 0 0 3px var(--mana-soft),var(--shadow)}
.node.drop-target .port.in{background:var(--mana)}
.node.sel-soft{border-color:color-mix(in srgb,var(--mana) 55%,var(--line-2))}
.n-more{display:block;width:100%;text-align:left;border:0;border-top:1px dashed var(--line-2);background:transparent;padding:6px 10px;font-family:var(--f-ui);font-size:12px;font-weight:600;color:var(--mana);border-radius:0 0 9px 9px}
button.n-more:hover{background:var(--mana-soft)}
.edges path.e.stale{stroke:var(--danger);stroke-dasharray:5 5;opacity:.85}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.ex-chip{font-family:var(--f-ui);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line-2);border-radius:4px;padding:0 4px}

.zoom{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:5}
.hint{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-family:var(--f-ui);font-size:12px;color:var(--faint);z-index:5;pointer-events:none;max-width:60%}

.empty{position:absolute;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none;padding:16px}
.empty .card{pointer-events:auto;max-width:420px;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:22px 22px 18px;box-shadow:var(--shadow)}
.empty h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 6px;text-wrap:balance}
.empty p{color:var(--muted);line-height:1.5;margin:0 0 14px}
.empty .row{display:flex;gap:8px;flex-wrap:wrap}

/* inspector */
.insp{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0}
.insp-empty{padding:28px 20px;color:var(--muted);line-height:1.55}
.insp-empty h3{font-family:var(--f-display);font-weight:400;color:var(--fg);font-size:19px;margin:0 0 8px}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:9px}
.sec h4{margin:0;font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.lbl{display:grid;gap:4px;font-family:var(--f-ui);font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
textarea.field{min-height:64px;resize:vertical;line-height:1.45}
.keyfield{display:flex;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;font-family:var(--f-mono);font-size:12.5px;overflow:hidden}
.keyfield span{padding:7px 0 7px 9px;color:var(--faint);white-space:nowrap}
.keyfield input{border:0;background:transparent;padding:7px 9px 7px 0;flex:1;min-width:0;outline:none}
.keyfield:focus-within{border-color:var(--mana)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:var(--panel-2);border:0;padding:7px 4px;font-family:var(--f-ui);font-weight:600;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:color-mix(in srgb,var(--tc) 22%,var(--panel-2));color:var(--fg);box-shadow:inset 0 -2px 0 var(--tc)}
.icon-row{display:flex;gap:12px;align-items:center}
.icon-row .mono-tile{width:88px;height:64px;font-size:26px}
.icon-row .acts{display:grid;gap:6px}
.icon-row small{color:var(--faint);font-family:var(--f-ui)}
.costline{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--f-ui);font-size:13px;color:var(--muted)}
.costline b{font-variant-numeric:tabular-nums;color:var(--fg)}
.costline .bad{color:var(--danger)}
.chips{display:grid;gap:5px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:4px 6px}
.chip .nm{flex:1;min-width:0;font-family:var(--f-ui);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;text-align:left;padding:0}
.qtyc{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;flex:none}
.qtyc button{background:var(--panel);border:0;width:24px;height:22px;padding:0;font-weight:700;color:var(--muted)}
.qtyc button:hover{color:var(--fg);background:var(--mana-soft)}
.qtyc b{min-width:20px;text-align:center;font-family:var(--f-ui);font-variant-numeric:tabular-nums}
.x{background:none;border:0;color:var(--faint);font-size:16px;line-height:1;padding:2px 5px;border-radius:4px}

<script>
(() => {
"use strict";
// Viewer copies of this page (opened outside claude.ai) load the published library from this address.
// On GitHub Pages it sits next to the page; for a downloaded copy use the file's raw GitHub link.
const LIBRARY_URL = "fob_library.json";
// The GitHub repo that the Pages copy reads from and publishes to ("owner/repo").
const GITHUB_REPO = "monpied/fob-forge";
const GITHUB_BRANCH = "main";
// ---------- definitions ----------
const STATS = [
  {k:"damage",label:"Damage",kv:"bonus_damage",prop:"MODIFIER_PROPERTY_PREATTACK_BONUS_DAMAGE",fn:"GetModifierPreAttack_BonusDamage"},
  {k:"affinity",label:"Affinity",kv:"bonus_affinity",custom:true,fn:"GetModifierAffinity"},
  {k:"health",label:"Health",kv:"bonus_health",prop:"MODIFIER_PROPERTY_HEALTH_BONUS",fn:"GetModifierHealthBonus"},
  {k:"mana",label:"Mana",kv:"bonus_mana",prop:"MODIFIER_PROPERTY_MANA_BONUS",fn:"GetModifierManaBonus"},
  {k:"armor",label:"Armor",kv:"bonus_armor",prop:"MODIFIER_PROPERTY_PHYSICAL_ARMOR_BONUS",fn:"GetModifierPhysicalArmorBonus"},
  {k:"magic_resist",label:"Magic Resistance",pct:true,kv:"bonus_magic_resist",prop:"MODIFIER_PROPERTY_MAGICAL_RESISTANCE_BONUS",fn:"GetModifierMagicalResistanceBonus"},
  {k:"attack_speed",label:"Attack Speed",kv:"bonus_attack_speed",prop:"MODIFIER_PROPERTY_ATTACKSPEED_BONUS_CONSTANT",fn:"GetModifierAttackSpeedBonus_Constant"},
  {k:"move_speed",label:"Move Speed",kv:"bonus_move_speed",prop:"MODIFIER_PROPERTY_MOVESPEED_BONUS_CONSTANT",fn:"GetModifierMoveSpeedBonus_Constant"},
  {k:"hp_regen",label:"Health Regen",kv:"bonus_hp_regen",prop:"MODIFIER_PROPERTY_HEALTH_REGEN_CONSTANT",fn:"GetModifierConstantHealthRegen"},
  {k:"mana_regen",label:"Mana Regen",kv:"bonus_mana_regen",prop:"MODIFIER_PROPERTY_MANA_REGEN_CONSTANT",fn:"GetModifierConstantManaRegen"},
  {k:"cdr",label:"Cooldown Reduction",pct:true,kv:"bonus_cooldown_reduction",prop:"MODIFIER_PROPERTY_COOLDOWN_PERCENTAGE",fn:"GetModifierPercentageCooldown"},
  {k:"str",label:"Strength",kv:"bonus_strength",prop:"MODIFIER_PROPERTY_STATS_STRENGTH_BONUS",fn:"GetModifierBonusStats_Strength"},
  {k:"agi",label:"Agility",kv:"bonus_agility",prop:"MODIFIER_PROPERTY_STATS_AGILITY_BONUS",fn:"GetModifierBonusStats_Agility"},
  {k:"int",label:"Intellect",kv:"bonus_intellect",prop:"MODIFIER_PROPERTY_STATS_INTELLECT_BONUS",fn:"GetModifierBonusStats_Intellect"},
  {k:"all_stats",label:"All Attributes",kv:"bonus_all_stats",attrs:true},
  {k:"spell_lifesteal",label:"Spell Lifesteal",pct:true,kv:"spell_lifesteal",lifesteal:true},
];
const STAT = Object.fromEntries(STATS.map(s=>[s.k,s]));
const TIERS = [["component","T1"],["advanced","T2"],["legendary","T3"]];
const TIER_LABEL = Object.fromEntries(TIERS);
const DEFAULT_BANDS = {component:[95,105], advanced:[105,115], legendary:[100,120]};
const QUALITY = {component:"component",advanced:"rare",legendary:"epic"};
const BEHAVIORS = {
  no_target:["No target","DOTA_ABILITY_BEHAVIOR_NO_TARGET | DOTA_ABILITY_BEHAVIOR_IMMEDIATE"],
  unit:["Unit target","DOTA_ABILITY_BEHAVIOR_UNIT_TARGET"],
  point:["Point target","DOTA_ABILITY_BEHAVIOR_POINT"],
};
const NODE_W = 184;
const heights = {};
const nodeH = id => heights[id] || 90;

// ---------- state ----------
// items: the library on the left. Each item's recipe (item.components) is its build graph.
const mkCol = () => ({docs:{}, queued:{}, inflight:{}, timers:{}});
const C = {items:mkCol()};
const S = {
  config:{prefix:"item_fob_", idStart:8000, goldRef:{}, goldManual:{}, bands:DEFAULT_BANDS},
  open:null,        // item whose build graph is on the canvas
  selPath:null,     // selected card in that graph: "r" is the item itself, "r.0.1" a part of a part
  selItem:null,
  history:[],
  view:{x:60,y:60,z:1},
  mode:"connecting", // connecting | live | local | ro
  db:null, assets:null, downloads:null,
  q:"",
  armDelete:false,
  loaded:{items:false},
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const fmt = n => Math.round(n).toLocaleString("en-US");
const uid = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,"").slice(0,16) : Math.random().toString(36).slice(2,18));

const colOf = col => col==="items" && S.viewing==="published" ? PUB : C[col];
function get(col,id){ const c=colOf(col); const b=c.docs[id]; if(!b) return null; return Object.assign({}, b, c.inflight[id]||{}, c.queued[id]||{}, {id}); }
const item = id => get("items",id);
function allItems(){ return Object.keys(colOf("items").docs).map(item).filter(Boolean); }
const canEdit = () => (S.mode==="live" || S.mode==="local") && S.viewing!=="published";

// ---------- persistence ----------
function saveLocal(){ if(S.standalone){ saveWork(); return; } if(S.mode!=="local") return; try{ localStorage.setItem("fob-forge-local", JSON.stringify({items:C.items.docs,config:S.config})); }catch(e){} }
function loadLocal(){ try{ const d = JSON.parse(localStorage.getItem("fob-forge-local")||"null"); if(d){ C.items.docs=d.items||d.docs||{}; S.config=Object.assign(S.config,d.config||{}); } }catch(e){} }

function patchDoc(col, id, p, delay=450){
  if(!canEdit() || !C[col].docs[id]) return;
  const c=C[col];
  if(S.mode==="local"){ c.docs[id] = Object.assign({}, c.docs[id], p); saveLocal(); render(); return; }
  c.queued[id] = Object.assign({}, c.queued[id], p);
  clearTimeout(c.timers[id]);
  c.timers[id] = setTimeout(()=>flush(col,id), delay);
  render();
}
const patch = (id,p,delay) => patchDoc("items",id,p,delay);
async function flush(col,id){
  const c=C[col];
  if(c.inflight[id]) return;            // the running write re-flushes when done
  const q = c.queued[id]; if(!q) return;
  delete c.queued[id]; c.inflight[id] = q;
  try{ q.updatedAt = Date.now(); await S.db.doc(col+"/"+id).update(q); }
  catch(e){ writeFailed(e); }
  finally{ delete c.inflight[id]; if(c.queued[id]) flush(col,id); else render(); }
}
async function setDoc(col, id, data){
  C[col].docs[id]=data;
  if(S.mode==="local"){ saveLocal(); render(); return id; }
  render();
  try{ await S.db.collection(col).doc(id).set(data); return id; }
  catch(e){ delete C[col].docs[id]; writeFailed(e); render(); return null; }
}
async function deleteDoc(col, id){
  const c=C[col]; const prev=c.docs[id]; if(!prev) return;
  delete c.docs[id]; delete c.queued[id]; clearTimeout(c.timers[id]);
  if(S.mode==="local"){ saveLocal(); render(); return; }
  render();
  try{ await S.db.doc(col+"/"+id).delete(); }catch(e){ c.docs[id]=prev; writeFailed(e); render(); }
}
async function createItem(data){
  const id = uid();
  return setDoc("items", id, Object.assign(blankItem(), data, {createdAt:Date.now(), updatedAt:Date.now()}));
}
function saveConfig(p){
  S.config = Object.assign({}, S.config, p);
  if(S.mode==="local"){ saveLocal(); return; }
  if(S.mode==="live") S.db.doc("config/forge").set(S.config).catch(writeFailed);
}
function writeFailed(e){
  const code = (e && e.code) || "";
  if(/permission|denied|not_granted|forbidden|unauth/i.test(code+" "+(e&&e.message))){
    setMode("ro"); toast("You can view this forge but not edit it. Ask the owner to share it with you as an Editor.");
  } else toast("Couldn't save: " + ((e&&e.message)||code||"unknown error"));
}

function blankItem(){
  return {name:"New item", key:"", keyEdited:false, tier:"component", category:"", cost:300, iconId:"",
    stats:{}, components:[], passive:{name:"",desc:""}, active:{on:false,name:"",desc:"",behavior:"no_target",cooldown:20,mana:0,range:0},
    values:[], lore:""};
}


// ---------- helpers ----------
function slug(s){ return String(s||"").toLowerCase().normalize("NFKD").replace(/[^\w\s]/g,"").trim().replace(/\s+/g,"_").replace(/_+/g,"_") || "item"; }
function fullKey(it){
  const base = it.key ? it.key : slug(it.name);
  return S.config.prefix + base;
}
function uniqueKeyFor(id, name){
  let base = slug(name), k = base, i = 2;
  const used = new Set(allItems().filter(x=>x.id!==id).map(x=>x.key||slug(x.name)));
  while(used.has(k)) k = base+"_"+(i++);
  return k;
}
function countBy(arr){ const m={}; arr.forEach(x=>m[x]=(m[x]||0)+1); return m; }
function compCost(it){ return (it.components||[]).reduce((a,c)=>a+num((item(c)||{}).cost),0); }
function usedIn(id){ return allItems().filter(x=>(x.components||[]).includes(id)); }
function wouldCycle(src, target){
  // adding src as component of target creates a cycle if target is inside src's tree (or src===target)
  if(src===target) return true;
  const seen=new Set(), stack=[src];
  while(stack.length){ const c=stack.pop(); if(c===target) return true; if(seen.has(c)) continue; seen.add(c); const it=item(c); if(it) stack.push(...(it.components||[])); }
  return false;
}
function iconSrc(it){ return it.iconData || (it.iconId && !S.standalone ? "/_blob/"+it.iconId : ""); }
function tile(it, w, h, fs){
  const src = iconSrc(it);
  const letters = esc((it.name||"?").split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase());
  return `<div class="mono-tile tier-${esc(it.tier)}" style="width:${w}px;height:${h}px;font-size:${fs}px">${src?`<img src="${esc(src)}" alt="" draggable="false">`:letters}</div>`;
}
function statText(k,v){ const s=STAT[k]; if(!s) return ""; return `+${v}${s.pct?"%":""} ${s.label}`; }

// ---------- gold efficiency ----------
// Each stat's gold value per point comes from a reference T1 item (cost ÷ amount) or a typed value.
function autoRef(k){
  const c = allItems().filter(i=>i.tier==="component" && num(i.cost)>0 && num((i.stats||{})[k])>0 &&
    Object.entries(i.stats||{}).filter(([s,v])=>STAT[s]&&num(v)).length===1);
  c.sort((a,b)=>num(a.cost)-num(b.cost)); return c[0]||null;
}
function goldValue(k){
  const m = (S.config.goldManual||{})[k];
  const r = (S.config.goldRef||{})[k];
  if(r==="manual") return m>0 ? {v:num(m), src:"manual"} : null;
  const ref = r && r!=="auto" ? item(r) : autoRef(k);
  if(ref && num((ref.stats||{})[k])>0 && num(ref.cost)>0) return {v:num(ref.cost)/num(ref.stats[k]), src:"ref", ref};
  if(k==="all_stats" && (!r || r==="auto")){
    const parts=["str","agi","int"].map(goldValue);
    if(parts.every(Boolean)) return {v:parts.reduce((a,p)=>a+p.v,0), src:"sum"};
  }
  return null;
}
function band(t){ const b=(S.config.bands||{})[t]||DEFAULT_BANDS[t]; return [num(b[0]),num(b[1])]; }
function efficiency(it){
  const rows=[]; let worth=0; const unpriced=[];
  for(const [k,v] of Object.entries(it.stats||{})){ if(!STAT[k]||!num(v)) continue;
    const g=goldValue(k); if(!g){ unpriced.push(STAT[k].label); continue; }
    const w=num(v)*g.v; worth+=w; rows.push({k,v:num(v),per:g.v,w}); }
  if(!rows.length || !num(it.cost)) return null;
  const pct = worth/num(it.cost)*100; const [lo,hi]=band(it.tier);
  return {pct, worth, rows, unpriced, state: pct<lo-0.05?"under":pct>hi+0.05?"over":"ok", lo, hi};
}
const effPill = e => e ? `<span class="eff ${e.state}" title="${e.state==="ok"?"Within":e.state==="over"?"Above":"Below"} the ${e.lo}–${e.hi}% target">${Math.round(e.pct)}%</span>` : "";

// ---------- build graph model ----------
// An item's graph is its recipe tree: the item on top, each recipe entry as its own card below,
// and each part's own recipe below that. Paths name cards: "r", "r.0", "r.0.1" (index into the recipe).
let collapsed = {};
try{ collapsed = JSON.parse(localStorage.getItem("fob-forge-collapsed")||"{}"); }catch(e){}
const isCollapsed = path => !!(collapsed[S.open]||[]).includes(path);
function setCollapsed(path, on){
  const list=new Set(collapsed[S.open]||[]); on?list.add(path):list.delete(path); collapsed[S.open]=[...list];
  try{ localStorage.setItem("fob-forge-collapsed", JSON.stringify(collapsed)); }catch(e){}
}
function buildTree(rootId){
  const out=[];
  const walk=(itemId,path,depth,parent,idx,stack)=>{
    const it=item(itemId); if(!it) return null;
    const parts=(it.components||[]).map((c,i)=>[c,i]).filter(([c])=>item(c));
    const n={path,item:itemId,depth,parent,idx,kids:[],partCount:parts.length,collapsed:path!=="r"&&isCollapsed(path),loop:stack.has(itemId)};
    out.push(n);
    if(n.collapsed || n.loop || depth>8) return n;
    const next=new Set(stack); next.add(itemId);
    for(const [c,i] of parts){ const k=walk(c,path+"."+i,depth+1,path,i,next); if(k) n.kids.push(k); }
    return n;
  };
  if(rootId && item(rootId)) walk(rootId,"r",0,null,null,new Set());
  return out;
}
function itemAtPath(path){
  if(!path||!S.open) return null;
  let cur=S.open; const segs=path.split(".").slice(1);
  for(const s of segs){ const it=item(cur); if(!it) return null; cur=(it.components||[])[num(s)]; }
  return item(cur) ? cur : null;
}
const parentPath = path => path && path.includes(".") ? path.slice(0,path.lastIndexOf(".")) : null;

// ---------- render ----------
let raf=0, needFit=false, tree=[];
const pos={};
function render(){ if(raf) return; raf=requestAnimationFrame(()=>{raf=0; draw();}); }
function draw(){
  const items = allItems();
  if(S.open && !item(S.open)){ S.open=null; S.selPath=null; }
  if(S.selPath && !itemAtPath(S.selPath)) S.selPath = S.open ? "r" : null;
  if(S.selItem && !item(S.selItem)) S.selItem=null;
  $("#count").textContent = items.length ? `${items.length} item${items.length===1?"":"s"}` : "";
  const settled = S.mode!=="connecting";
  $("#empty").hidden = !(settled && !S.open);
  const viewerEmpty = !S.isAdmin && S.db && !items.length;
  const standaloneEmpty = S.standalone && S.loadFailed && !items.length;
  $("#btnImportLib").hidden = !standaloneEmpty;
  $("#emptyTitle").textContent = standaloneEmpty ? "Couldn't load the item library" : viewerEmpty ? "No items published yet" : items.length ? "Pick an item to see its build graph" : "Start your item library";
  $("#emptyText").textContent = standaloneEmpty ? `GitHub (${GITHUB_REPO}) couldn't be reached. Check your connection and reload, or import a fob_library.json file you were sent.` : viewerEmpty ? "The item library appears here as soon as its owner publishes the first release." : items.length
    ? "Every item in the library has its own build graph. Open one, then drag other items from the library onto it to add them to its recipe."
    : "Create your first item. Components get a graph of their own too, so build T1 items first, then drag them into bigger ones.";
  $("#btnExample").hidden = !canEdit() || items.length>0 || !!S.standalone;
  $("#btnFirst").hidden = !canEdit() || items.length>0;
  $("#btnCreate").disabled = !canEdit();
  document.getElementById("app").classList.toggle("ro", !canEdit());
  $("#hint").hidden = !canEdit();
  drawReleaseBar(); drawCrumbs(); drawList(items); drawGraph(); drawInspector();
  applyView();
}
function drawCrumbs(){
  const el=$("#crumbs"); const it=S.open&&item(S.open);
  el.hidden=!it; if(!it) return;
  const back=S.history.filter(id=>item(id)).slice(-1)[0];
  el.innerHTML=`${back?`<button class="btn sm ghost" data-back="1" aria-label="Back to ${esc(item(back).name)}">← ${esc(item(back).name)}</button>`:""}<span class="crumb-k">Build graph</span><span class="crumb-n tier-${it.tier}">${esc(it.name)}</span>`;
}
function drawList(items){
  const q = S.q.trim().toLowerCase();
  const html = TIERS.map(([t,label])=>{
    const rows = items.filter(i=>i.tier===t && (!q || (i.name||"").toLowerCase().includes(q) || (i.category||"").toLowerCase().includes(q)))
      .sort((a,b)=>num(a.cost)-num(b.cost)||String(a.name).localeCompare(b.name));
    if(!rows.length) return "";
    return `<div class="group-h"><span>${label}</span><span>${rows.length}</span></div>` + rows.map(i=>{ const parts=(i.components||[]).length;
      return `<button class="li tier-${i.tier} ${S.open===i.id?"open":""} ${S.selItem===i.id&&S.open!==i.id?"sel":""}" data-pick="${i.id}" title="Open ${esc(i.name)}'s build graph · drag into another graph to use it as a part">${tile(i,26,19,10)}<span class="nm">${esc(i.name)}${parts?`<small>${parts} part${parts===1?"":"s"}</small>`:""}</span>${effPill(efficiency(i))}<span class="gold">${fmt(num(i.cost))}</span></button>`; }).join("");
  }).join("");
  $("#list").innerHTML = html || `<p class="note" style="padding:8px">${items.length?"No items match.":"Your library is empty."}</p>`;
}
const nodeCache = {};
function drawGraph(){
  const host=$("#nodes");
  tree = buildTree(S.open);
  const keep=new Set(); const rel=relatedPaths();
  for(const n of tree){
    const it=item(n.item); keep.add(n.path);
    let el=host.querySelector(`[data-path="${n.path}"]`);
    if(!el){ el=document.createElement("div"); el.dataset.path=n.path; host.appendChild(el); }
    const stats=Object.entries(it.stats||{}).filter(([k,v])=>STAT[k]&&num(v));
    const comb=(it.components||[]).length ? num(it.cost)-compCost(it) : null;
    const fx=[];
    if(it.passive && it.passive.name) fx.push(`<span><em>Passive</em>${esc(it.passive.name)}</span>`);
    if(it.active && it.active.on) fx.push(`<span><em>Active</em>${esc(it.active.name||"Unnamed")}</span>`);
    const foot = n.path!=="r" && n.partCount
      ? `<div class="n-foot"><button data-toggle="${n.path}">${n.collapsed?`▸ Show ${n.partCount} part${n.partCount===1?"":"s"}`:"▾ Hide parts"}</button><button data-open="${n.item}" title="Open ${esc(it.name)}'s own build graph">Open ↗</button></div>`
      : n.path!=="r" ? `<div class="n-foot"><button data-open="${n.item}" title="Open ${esc(it.name)}'s own build graph">Open ↗</button></div>` : "";
    const html=`<span class="port in"></span>${n.path!=="r"?`<span class="port out"></span>`:""}
      <div class="n-head">${tile(it,44,32,15)}<div style="min-width:0"><div class="n-name">${esc(it.name)}</div>
      <div class="n-sub"><span class="tier-tag">${TIER_LABEL[it.tier]||""}</span><span class="gold">${fmt(num(it.cost))}</span>${effPill(efficiency(it))}</div>${comb!==null?`<div class="n-sub"><small>combine ${fmt(comb)}</small></div>`:""}</div></div>
      ${stats.length?`<ul>${stats.map(([k,v])=>{const s=STAT[k];return `<li><b>+${esc(v)}${s.pct?"%":""}</b> ${s.label}</li>`}).join("")}</ul>`:""}
      ${fx.length?`<div class="n-fx">${fx.join("")}</div>`:""}${foot}`;
    if(nodeCache[n.path]!==html){ el.innerHTML=html; nodeCache[n.path]=html; }
    el.className=`node tier-${it.tier}${n.path==="r"?" root":""}${S.selPath===n.path?" sel":""}${rel&&!rel.has(n.path)?" dim":""}`;
  }
  host.querySelectorAll(".node").forEach(el=>{ if(!keep.has(el.dataset.path)){ delete nodeCache[el.dataset.path]; el.remove(); } });
  layout(host);
  drawEdges();
  if(needFit && tree.length){ needFit=false; fit(); }
}
function relatedPaths(){
  if(!S.selPath||S.selPath==="r") return null;
  const set=new Set(); tree.forEach(n=>{ if(n.path===S.selPath||n.path.startsWith(S.selPath+".")||S.selPath.startsWith(n.path+".")) set.add(n.path); });
  return set;
}
// shop layout: leaves get one column each, every item centred over its parts, rows sized to the tallest card
function layout(host){
  const H={}; host.querySelectorAll(".node").forEach(el=>H[el.dataset.path]=el.offsetHeight);
  const byPath=Object.fromEntries(tree.map(n=>[n.path,n]));
  let cursor=0; const col={};
  const lay=n=>{ if(!n.kids.length){ col[n.path]=cursor++; return col[n.path]; }
    const c=n.kids.map(lay); col[n.path]=(c[0]+c[c.length-1])/2; return col[n.path]; };
  if(tree[0]) lay(tree[0]);
  const rowH={}; tree.forEach(n=>rowH[n.depth]=Math.max(rowH[n.depth]||0,H[n.path]||90));
  const rowY={}; let y=0; Object.keys(rowH).map(Number).sort((a,b)=>a-b).forEach(d=>{ rowY[d]=y; y+=rowH[d]+64; });
  const GAPX=NODE_W+32;
  for(const k in pos) delete pos[k];
  tree.forEach(n=>{ pos[n.path]={x:col[n.path]*GAPX, y:rowY[n.depth], h:H[n.path]||90};
    const el=host.querySelector(`[data-path="${n.path}"]`); if(el) el.style.transform=`translate(${pos[n.path].x}px,${pos[n.path].y}px)`; });
}
function drawEdges(){
  let out="";
  for(const n of tree){
    if(!n.parent) continue; const a=pos[n.path], b=pos[n.parent]; if(!a||!b) continue;
    const x1=a.x+NODE_W/2, y1=a.y, x2=b.x+NODE_W/2, y2=b.y+b.h, dy=Math.max(24,(y1-y2)*.5);
    const rel=relatedPaths(); const dim=rel&&!(rel.has(n.path)&&rel.has(n.parent));
    out+=`<path class="e${S.selPath===n.path?" sel":""}${dim?" dim":""}" d="M${x1},${y1} C${x1},${y1-dy} ${x2},${y2+dy} ${x2},${y2}"/>`;
  }
  $("#edges").innerHTML=out;
}

function resizeIcon(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>res(toPng(im)); im.onerror=rej; im.src=r.result; }; r.onerror=rej; r.readAsDataURL(f); }); }
function toPng(im){ const c=document.createElement("canvas"); c.width=88; c.height=64; const g=c.getContext("2d"); const s=Math.max(88/im.width,64/im.height); const w=im.width*s,h=im.height*s; g.drawImage(im,(88-w)/2,(64-h)/2,w,h); return c.toDataURL("image/png"); }

// ---------- graph ops ----------
function openGraph(id, {push=true, fit:doFit=true}={}){
  if(!item(id)) return;
  if(push && S.open && S.open!==id){ S.history.push(S.open); if(S.history.length>20) S.history.shift(); }
  S.open=id; S.selPath="r"; S.selItem=id; S.armDelete=false; inspFor=null;
  try{ localStorage.setItem("fob-forge-open", id); }catch(e){}
  $("#nodes").innerHTML=""; for(const k in nodeCache) delete nodeCache[k];
  if(doFit) needFit=true;
  if(window.matchMedia("(max-width:820px)").matches) $("#side").hidden=true;
  render();
}
function goBack(){ const id=S.history.pop(); if(id && item(id)) openGraph(id,{push:false}); }
function selectPath(path){ S.selPath=path; S.selItem=itemAtPath(path); S.armDelete=false; inspFor=null; render(); }
const select = id => openGraph(id);
function addPart(src, target){
  if(!canEdit()) return false;
  const t=item(target), s=item(src); if(!t||!s) return false;
  if(wouldCycle(src,target)){ toast(src===target?"An item can't be part of itself.":`${t.name} is already inside ${s.name}'s build.`); return false; }
  const comps=[...(t.components||[]),src];
  patch(target,{components:comps},0); inspFor=null;
  const n=comps.filter(x=>x===src).length;
  toast(n>1?`${t.name} now needs ${n}× ${s.name}`:`${s.name} added to ${t.name}`);
  return true;
}
const addComponent = addPart;
function removePart(path){
  const pp=parentPath(path); if(!pp||!canEdit()) return;
  const pid=itemAtPath(pp), p=item(pid); if(!p) return;
  const idx=num(path.slice(path.lastIndexOf(".")+1));
  const before=[...(p.components||[])]; const gone=item(before[idx]);
  const after=before.filter((_,i)=>i!==idx);
  patch(pid,{components:after},0);
  setCollapsed(path,false);
  S.selPath=pp; S.selItem=pid; inspFor=null;

function fit(){
  const ps=Object.values(pos); if(!ps.length) return;
  const r=stage.getBoundingClientRect();

  S.view.z=z; S.view.x=(r.width-(x1-x0)*z)/2-x0*z; S.view.y=top+((r.height-top-pad)-(y1-y0)*z)/2-y0*z; applyView();
}

function libraryOf(itemsArr){ const m={}; itemsArr.forEach(it=>m[it.id]=it); return m; }
function draftSnapshot(){
  return Object.keys(C.items.docs).map(id=>{ const o=Object.assign({},get("items",id)); delete o.iconData; return o; });
}
function describeChanges(oldArr, newArr){
  const A=libraryOf(oldArr), B=libraryOf(newArr);
  const nm=(lib,id)=>(lib[id]&&lib[id].name)||"removed item";
  const recipe=(lib,it)=>{ const c=countBy(it.components||[]); return Object.entries(c).map(([id,n])=>nm(lib,id)+(n>1?` ×${n}`:"")).sort().join(", ")||"bought outright"; };
  const same=(x,y)=>JSON.stringify(x??null)===JSON.stringify(y??null);
  const added=[], removed=[], changed=[];
  for(const id in B){ if(!A[id]) added.push(B[id].name); }
  for(const id in A){ if(!B[id]) removed.push(A[id].name); }
  for(const id in B){ const a=A[id], b=B[id]; if(!a) continue; const lines=[];
    if(a.name!==b.name) lines.push(`renamed from ${a.name}`);
    if(num(a.cost)!==num(b.cost)) lines.push(`cost ${fmt(num(a.cost))} → ${fmt(num(b.cost))}`);
    if(a.tier!==b.tier) lines.push(`${TIER_LABEL[a.tier]} → ${TIER_LABEL[b.tier]}`);
    const ks=new Set([...Object.keys(a.stats||{}),...Object.keys(b.stats||{})]);
    ks.forEach(k=>{ if(!STAT[k]) return; const x=num((a.stats||{})[k]), y=num((b.stats||{})[k]); if(x===y) return;
      const pct=STAT[k].pct?"%":"";
      lines.push(!x?`now gives +${y}${pct} ${STAT[k].label}`:!y?`no longer gives ${STAT[k].label}`:`${STAT[k].label} ${x}${pct} → ${y}${pct}`); });
    if(recipe(A,a)!==recipe(B,b)) lines.push(`recipe: ${recipe(A,a)} → ${recipe(B,b)}`);
    if(!same(a.passive,b.passive)) lines.push(b.passive&&b.passive.name?(a.passive&&a.passive.name?"passive reworked":`new passive: ${b.passive.name}`):"passive removed");
    if(!same(a.active,b.active)) lines.push(b.active&&b.active.on?(a.active&&a.active.on?"active reworked":`new active: ${b.active.name||"unnamed"}`):"active removed");
    if(!same(a.values,b.values)) lines.push("effect values tuned");
    if((a.category||"")!==(b.category||"")) lines.push(`shop category ${a.category||"none"} → ${b.category||"none"}`);
    if((a.iconId||"")!==(b.iconId||"")) lines.push("new icon");
    if((a.lore||"")!==(b.lore||"")) lines.push("lore updated");
    if(lines.length) changed.push({name:b.name,lines});
  }
  return {added:added.sort(), removed:removed.sort(), changed:changed.sort((x,y)=>x.name.localeCompare(y.name))};
}
const changeCount = ch => ch.added.length+ch.removed.length+ch.changed.length;
function pendingChanges(){ const r=latest(); return describeChanges(r?(r.items||[]):[], draftSnapshot()); }
function changesHTML(ch){
  if(!changeCount(ch)) return `<p class="note" style="margin:0">No item changes.</p>`;
  return `<ul class="chg">${ch.added.map(n=>`<li><span class="tag add">New</span>${esc(n)}</li>`).join("")}
    ${ch.changed.map(c=>`<li><span class="tag chg2">Changed</span><b>${esc(c.name)}</b><span class="muted">: ${esc(c.lines.join(" · "))}</span></li>`).join("")}
    ${ch.removed.map(n=>`<li><span class="tag rm">Removed</span>${esc(n)}</li>`).join("")}</ul>`;
}

// ---------- viewer library (fob_library.json) ----------
// The latest release with icons baked in and the full changelog, for the standalone viewer page.
async function buildLibraryFile(){
  const r=latest(); if(!r) throw new Error("Publish a release first");
  const items=[];
  for(const it of r.items||[]){
    const o=Object.assign({},it); delete o.iconData;
    try{ if(o.iconId){ const png=await iconPng({iconId:o.iconId}); if(png){ let b=""; png.forEach(x=>b+=String.fromCharCode(x)); o.iconData="data:image/png;base64,"+btoa(b); } } }catch(e){}
    delete o.iconId; items.push(o);
  }
  items.sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  return JSON.stringify({format:"fob-library",forge:"fob Item Forge",version:r.version,publishedAt:r.publishedAt,config:r.config||{},items,
    releases:S.releases.map(x=>({version:x.version,publishedAt:x.publishedAt,notes:x.notes||"",changes:x.changes||{added:[],removed:[],changed:[]}}))},null,1)+"\n";
}
async function downloadLibrary(btn){
  if(!S.downloads){ toast("Downloads aren't available in this view."); return; }
  btn.disabled=true; const label=btn.textContent; btn.textContent="Building…";
  try{ await S.downloads.save({filename:"fob_library.json",data:await buildLibraryFile()}); toast("Saved fob_library.json"); }
  catch(e){ if(e&&e.code!=="declined"&&e.code!=="cancelled") toast("Download didn't finish: "+((e&&e.message)||e&&e.code||"cancelled")); }
  finally{ btn.disabled=false; btn.textContent=label; }
}
// ---------- shared library on GitHub (the Pages copy of this page) ----------
// Everyone edits a working copy kept in their own browser. Publishing re-reads the newest
// fob_library.json from the repo, merges it with your edits field by field, stops on real
// conflicts, and commits with the file's sha, so GitHub refuses any publish that would
// overwrite something it hasn't seen.
const GH_API = "https://api.github.com";
const ghRepo = () => { const [owner,repo]=(GITHUB_REPO||"").split("/"); return {owner,repo,branch:GITHUB_BRANCH||"main",path:"fob_library.json"}; };
const emptyLibrary = () => ({format:"fob-library",version:0,publishedAt:0,config:{},items:[],releases:[]});
S.base = null;            // the library your working copy started from
S.remote = null;          // newest library seen online (may be newer than base)
S.gh = {token:"", login:"", canPush:null};
const VOLATILE = new Set(["updatedAt","createdAt","id"]);
function canon(v){ return Array.isArray(v)?v.map(canon):v&&typeof v==="object"?Object.fromEntries(Object.keys(v).filter(k=>!VOLATILE.has(k)).sort().map(k=>[k,canon(v[k])])):v; }
const same = (a,b) => JSON.stringify(canon(a??null))===JSON.stringify(canon(b??null));
const itemsMap = arr => { const m={}; (arr||[]).forEach(it=>{ const o=Object.assign({},it); const id=o.id; delete o.id; delete o.fullKey; delete o.componentKeys; m[id]=o; }); return m; };
const itemsArr = map => Object.entries(map).map(([id,o])=>Object.assign({id},o));
const cfgOf = c => Object.assign({prefix:"item_fob_",idStart:8000,goldRef:{},goldManual:{},bands:DEFAULT_BANDS},c||{});

function saveWork(){

}
function myChanges(){ return describeChanges((S.base&&S.base.items)||[], draftSnapshot()); }
const hasEdits = () => changeCount(myChanges())>0 || !same(cfgOf(S.base&&S.base.config), S.config);
function historyOf(lib){
  const h=(lib.releases||[]).map(r=>Object.assign({},r)).sort((a,b)=>num(b.version)-num(a.version));
  if(h[0]) h[0]=Object.assign(h[0],{items:lib.items,config:lib.config}); else if(lib.version) h.push({version:lib.version,publishedAt:lib.publishedAt,items:lib.items,config:lib.config});
  return h;
}
// Make a library the new starting point: your working copy becomes exactly that library.
function adopt(lib){
  S.base=lib; S.remote=lib; S.releases=historyOf(lib);
  C.items.docs=itemsMap(lib.items); S.config=cfgOf(lib.config);
  saveWork();
  if(S.open && !item(S.open)) S.open=null;
  if(!S.open){ const top=allItems().sort((a,b)=>num(b.cost)-num(a.cost))[0]; if(top) openGraph(top.id,{push:false}); }

}
// A newer library arrived online: take it if you have no edits; otherwise keep your edits and merge at publish.
function onRemote(lib, from){
  if(!lib) return;
  const prev=S.remote?num(S.remote.version):null;
  S.remote = !S.remote || num(lib.version)>=num(S.remote.version) ? lib : S.remote;
  if(!S.base || !hasEdits()){ if(!S.base || num(lib.version)!==num(S.base.version) || !same(lib.items,S.base.items)) adopt(lib); }
  else render();
  if(prev!==null && num(lib.version)>prev) toast(`v${lib.version} is online${hasEdits()?" — your edits will be merged into it when you publish":""}`,"What changed",openUpdates);
}

// --- GitHub API ---
async function gh(path, opts={}){
  const headers=Object.assign({"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}, S.gh.token?{"Authorization":"Bearer "+S.gh.token}:{} , opts.headers||{});
  const r=await fetch(GH_API+path,Object.assign({cache:"no-store"},opts,{headers}));
  let body=null; try{ body=await r.json(); }catch(e){}
  if(!r.ok){ const err=new Error((body&&body.message)||("GitHub answered "+r.status)); err.status=r.status; throw err; }
  if(opts.withHeaders) return {body, headers:r.headers};
  return body;
}
const b64ToText = b64 => { const bin=atob(b64.replace(/\s/g,"")); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); };
const textToB64 = txt => { const u=new TextEncoder().encode(txt); let s=""; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); };
async function readRepoLibrary(){
  const g=ghRepo();
  try{
    const meta=await gh(`/repos/${g.owner}/${g.repo}/contents/${g.path}?ref=${encodeURIComponent(g.branch)}`);
    let text = meta.content && meta.encoding==="base64" ? b64ToText(meta.content) : null;
    if(!text){ const blob=await gh(`/repos/${g.owner}/${g.repo}/git/blobs/${meta.sha}`); text=b64ToText(blob.content); }
    return {lib:JSON.parse(text), sha:meta.sha};
  }catch(e){ if(e.status===404) return {lib:null, sha:null}; throw e; }
}
async function readPublicLibrary(){
  const url = location.protocol==="file:" ? `https://${ghRepo().owner}.github.io/${ghRepo().repo}/${ghRepo().path}` : LIBRARY_URL;
  const r=await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"}); if(r.status===404) return null; if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function refreshRemote(){
  try{ const lib = S.gh.token ? (await readRepoLibrary()).lib : await readPublicLibrary(); onRemote(lib||emptyLibrary()); S.loadFailed=false; return true; }
  catch(e){ S.loadFailed=!S.base; render(); return false; }
}
async function connectToken(tok){
  S.gh.token=tok.trim();
  const who=await gh("/user",{withHeaders:true}); const u=who.body; const g=ghRepo();
  const scopes=who.headers.get("x-oauth-scopes");
  S.gh.kind = scopes===null ? "fine-grained" : "classic";
  if(scopes!==null && !/(^|,\s*)(public_repo|repo)(\s*,|$)/.test(scopes)){ const e=new Error("this token doesn't have the public_repo box ticked, so it can't change files. Make a new one with the link above."); e.status=0; throw e; }
  const repo=await gh(`/repos/${g.owner}/${g.repo}`);
  S.gh.login=u.login; S.gh.canPush=!!(repo.permissions&&repo.permissions.push);
  try{ localStorage.setItem("fob-gh-token:"+GITHUB_REPO, S.gh.token); }catch(e){}
  return S.gh.canPush;
}
async function discardToLive(){
  let lib=null;
  try{ lib = S.gh.token ? (await readRepoLibrary()).lib : await readPublicLibrary(); }catch(e){}
  if(!lib) lib = S.remote || S.base;
  if(!lib){ toast("Couldn't reach GitHub. Try again when you're online."); return; }
  ghChoices={}; ghPending=null;
  try{ localStorage.removeItem("fob-gh-work:"+GITHUB_REPO); }catch(e){}
  adopt(lib); closeDialog();

}
function forgetToken(){ S.gh={token:"",login:"",canPush:null}; try{ localStorage.removeItem("fob-gh-token:"+GITHUB_REPO); }catch(e){} render(); }

// --- three-way merge: base (what you started from), mine (your copy), theirs (newest online) ---
function merge3(base, mine, theirs, choices={}){
  const B=itemsMap(base.items), M=C.items.docs, T=itemsMap(theirs.items);
  const out={}, conflicts=[], ids=new Set([...Object.keys(B),...Object.keys(M),...Object.keys(T)]);
  for(const id of ids){
    const b=B[id], m=M[id], t=T[id];
    const mc=!same(b,m), tc=!same(b,t);
    let res;
    if(!mc) res=t; else if(!tc) res=m; else if(same(m,t)) res=m;
    else if(choices[id]) res = choices[id]==="mine" ? m : t;
    else if(!m||!t||!b){ conflicts.push({id, kind: !m?"you deleted it, they changed it":!t?"they deleted it, you changed it":"added twice", mine:m, theirs:t, fields:[]}); continue; }
    else {
      const keys=new Set([...Object.keys(b),...Object.keys(m),...Object.keys(t)]); const r={}, clash=[];
      keys.forEach(k=>{ if(VOLATILE.has(k)) { r[k]=Math.max(num(m[k]),num(t[k]))||m[k]; return; }
        const bm=!same(b[k],m[k]), bt=!same(b[k],t[k]);
        if(bm&&bt&&!same(m[k],t[k])) clash.push(k);
        r[k]= bm ? m[k] : t[k]; });
      if(clash.length){ conflicts.push({id, kind:"both changed", mine:m, theirs:t, fields:clash}); continue; }
      res=r;
    }
    if(res) out[id]=res;
  }
  // gold values & settings
  const bc=cfgOf(base.config), mc=S.config, tc=cfgOf(theirs.config), cfg={}; const cfgClash=[];
  new Set([...Object.keys(bc),...Object.keys(mc),...Object.keys(tc)]).forEach(k=>{
    const bm=!same(bc[k],mc[k]), bt=!same(bc[k],tc[k]);
    if(bm&&bt&&!same(mc[k],tc[k])&&!choices["__config"]) cfgClash.push(k);
    cfg[k]= bm&&(!bt||choices["__config"]==="mine") ? mc[k] : tc[k]; });
  if(cfgClash.length) conflicts.push({id:"__config", kind:"both changed", name:"Gold values & export settings", fields:cfgClash});
  return {items:out, config:cfg, conflicts};
}
// keep every published Dota ID and internal name; new items get fresh ones
function settleNewItems(items, theirs){
  const T=itemsMap(theirs.items); const used=new Set(), keys=new Set(); let next=num(cfgOf(theirs.config).idStart);
  Object.values(T).forEach(it=>{ if(num(it.dotaId)) { used.add(num(it.dotaId)); next=Math.max(next,num(it.dotaId)+2); } keys.add(it.key||slug(it.name)); });
  const renamed=[];
  for(const [id,it] of Object.entries(items)){
    if(T[id]) continue;
    if(!num(it.dotaId) || used.has(num(it.dotaId))){ it.dotaId=next; next+=2; } used.add(num(it.dotaId));
    let k=it.key||slug(it.name), base=k, i=2; while(keys.has(k)) k=base+"_"+(i++);
    if(k!==(it.key||slug(it.name))){ renamed.push(`${it.name}: ${S.config.prefix}${base} → ${S.config.prefix}${k}`); it.key=k; it.keyEdited=true; }
    keys.add(k);
  }
  for(const it of Object.values(items)) it.components=(it.components||[]).filter(c=>items[c]);
  return renamed;
}

      try{ const ok=await connectToken(tok); ghBusy=false; await refreshRemote(); drawGhPublish(ok?"":`Connected as ${S.gh.login}, but that account can't write to ${ghRepo().owner}/${ghRepo().repo}. Ask ${ghRepo().owner} to add you as a collaborator.`); }

async function publishToGitHub(){
  const notes=($("#g-notes")?.value ?? (ghPending&&ghPending.notes) ?? "").trim();
  ghBusy=true;
  for(let attempt=0; attempt<4; attempt++){
    drawGhPublish(attempt?"Someone published at the same moment, merging again…":"Fetching the newest library…");
    let theirs, sha;
    try{ const r=await readRepoLibrary(); theirs=r.lib||emptyLibrary(); sha=r.sha; }
    catch(err){ ghBusy=false; drawGhPublish("Couldn't read the library from GitHub: "+err.message); return; }
    const base=S.base||emptyLibrary();
    const merged=merge3(base, null, theirs, ghChoices);
    if(merged.conflicts.length){ ghBusy=false; ghPending={theirs,conflicts:merged.conflicts,notes}; drawGhPublish(); return; }
    const items=JSON.parse(JSON.stringify(merged.items));
    const renamed=settleNewItems(items, theirs);
    const nextV=num(theirs.version)+1;
    const newArr=itemsArr(items).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
    const changes=describeChanges(theirs.items||[], newArr);
    if(!changeCount(changes) && same(cfgOf(theirs.config),merged.config)){ ghBusy=false; adopt(theirs); closeDialog(); toast(`Nothing new to publish — v${theirs.version} already has all of this`); return; }
    const lib={format:"fob-library",forge:"fob Item Forge",version:nextV,publishedAt:Date.now(),config:merged.config,items:newArr,
      releases:[{version:nextV,publishedAt:Date.now(),by:S.gh.login,notes,changes},...(theirs.releases||[])].slice(0,200)};
    const g=ghRepo();
    drawGhPublish(`Publishing v${nextV}…`);
    try{
      await gh(`/repos/${g.owner}/${g.repo}/contents/${g.path}`,{method:"PUT",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(Object.assign({message:`Items v${nextV}${notes?": "+notes.split("\n")[0].slice(0,72):""} (by ${S.gh.login})`,content:textToB64(JSON.stringify(lib,null,1)+"\n"),branch:g.branch}, sha?{sha}:{}))});
    }catch(err){
      if(err.status===409||err.status===422) continue;   // the file changed since we read it: read it again and re-merge
      ghBusy=false;
      const tokenProblem=/personal access token|not accessible by integration/i.test(err.message);
      drawGhPublish(tokenProblem?`This token isn't allowed to change files in ${g.owner}/${g.repo}. Click Forget token, then make a new one with the GitHub link (keep public_repo ticked). A fine-grained token only works if it's set to this repo with Contents: Read and write.`:err.status===403||err.status===404?`GitHub refused the publish (${err.message}). Your account needs write access to ${g.owner}/${g.repo}; ask ${g.owner} to add you as a collaborator.`:"Publishing failed: "+err.message); return;
    }
    ghBusy=false; ghChoices={}; ghPending=null;
    adopt(lib); closeDialog();
    toast(`Published v${nextV}${renamed.length?` · renamed ${renamed.length} duplicate internal name${renamed.length===1?"":"s"}`:""}. The site updates in about a minute.`);
    return;
  }
  ghBusy=false; drawGhPublish("Several people are publishing right now. Try again in a minute; nothing was overwritten.");
}

function q(s){ return '"'+String(s).replace(/\\/g,"\\\\").replace(/"/g,'\\"')+'"'; }
function sortedForExport(){ return allItems().sort((a,b)=>fullKey(a).localeCompare(fullKey(b))); }
// Each item keeps the Dota ID it was first exported with, so adding or renaming items never renumbers others.
function dotaIds(){
  const ids={}; let next=num(S.config.idStart);
  allItems().forEach(it=>{ if(num(it.dotaId)>0){ ids[it.id]=num(it.dotaId); next=Math.max(next,num(it.dotaId)+2); } });
  allItems().filter(it=>!ids[it.id]).sort((a,b)=>num(a.createdAt)-num(b.createdAt)||fullKey(a).localeCompare(fullKey(b)))
    .forEach(it=>{ ids[it.id]=next; next+=2; });
  return ids;
}

    if(it.passive&&it.passive.name) parts.push(`<h1>Passive: ${it.passive.name}</h1>${it.passive.desc||""}`);
    if(parts.length) L.push(`\t${q(T+"_Description")}\t${q(parts.join("<br><br>"))}`);
    if(it.lore) L.push(`\t${q(T+"_Lore")}\t${q(it.lore)}`);
    Object.entries(it.stats||{}).forEach(([k])=>{ const s=STAT[k]; if(s) L.push(`\t${q(T+"_"+s.kv)}\t${q((s.pct?"%+":"+")+s.label)}`); });
    if((it.components||[]).length) L.push(`\t${q("DOTA_Tooltip_ability_"+key.replace(/^item_/,"item_recipe_"))}\t${q(it.name+" Recipe")}`);

}
function buildLua(it){
  const key=fullKey(it), mod="modifier_"+key;
  const stats=Object.entries(it.stats||{}).filter(([k,v])=>STAT[k]&&v!=="");
  const a=it.active&&it.active.on?it.active:null;
  const L=[];
  L.push(`-- ${it.name} (${key}) · generated by fob Item Forge`);
  L.push(`LinkLuaModifier("${mod}", "items/${key}", LUA_MODIFIER_MOTION_NONE)`,"");
  L.push(`${key} = class({})`,"");
  L.push(`function ${key}:GetIntrinsicModifierName()`,`\treturn "${mod}"`,"end","");
  if(a){
    L.push(`-- Active: ${a.name||"Active"}`);
    if(a.desc) L.push(`-- ${a.desc.replace(/\n/g," ")}`);
    L.push(`function ${key}:OnSpellStart()`,`\tlocal caster = self:GetCaster()`);
    if(a.behavior==="unit") L.push(`\tlocal target = self:GetCursorTarget()`);
    if(a.behavior==="point") L.push(`\tlocal point = self:GetCursorPosition()`);
    (it.values||[]).filter(v=>v.key).forEach(v=>L.push(`\tlocal ${v.key} = self:GetSpecialValueFor("${v.key}")`));
    L.push(`\t-- TODO: ${a.name||"active"} effect`,"end","");
  }
  L.push(`${mod} = class({})`,"");
  L.push(`function ${mod}:IsHidden() return true end`,`function ${mod}:IsPurgable() return false end`,`function ${mod}:RemoveOnDeath() return false end`,`function ${mod}:GetAttributes() return MODIFIER_ATTRIBUTE_MULTIPLE end`,"");
  L.push(`local function sv(m, name)`,`\tlocal ab = m:GetAbility()`,`\treturn ab and ab:GetSpecialValueFor(name) or 0`,`end`,"");
  // All Attributes adds to Strength, Agility and Intellect, so those three getters sum both values
  const hasAll=stats.some(([k])=>k==="all_stats"), hasLs=stats.some(([k])=>k==="spell_lifesteal");
  const ATTR=["str","agi","int"];
  const props=[...new Set([...stats.map(([k])=>STAT[k]).filter(s=>s.prop), ...(hasAll?ATTR.map(k=>STAT[k]):[])])];
  L.push(`function ${mod}:DeclareFunctions()`,`\treturn {`);
  props.forEach(s=>L.push(`\t\t${s.prop},`));
  if(hasLs) L.push(`\t\tMODIFIER_EVENT_ON_TAKEDAMAGE,`);
  if(it.passive&&it.passive.name) L.push(`\t\t-- add events for ${it.passive.name} here, e.g. MODIFIER_EVENT_ON_ATTACK_LANDED`);
  L.push(`\t}`,"end","");
  stats.forEach(([k])=>{ const s=STAT[k];
    if(s.attrs || s.lifesteal) return;
    if(hasAll && ATTR.includes(k)) return;
    if(s.custom) L.push(`-- Affinity is a fob stat, not an engine property: read it from your damage code`,`-- by summing GetModifierAffinity() over the hero's item modifiers.`);
    L.push(`function ${mod}:${s.fn}() return sv(self, "${s.kv}") end`); });
  if(hasAll) ATTR.forEach(k=>{ const s=STAT[k]; const own=stats.some(([x])=>x===k);
    L.push(`function ${mod}:${s.fn}() return sv(self, "bonus_all_stats")${own?` + sv(self, "${s.kv}")`:""} end`); });
  if(hasLs){
    L.push("",`-- Spell Lifesteal: heal for a % of damage dealt by abilities (not attacks)`,
      `function ${mod}:OnTakeDamage(params)`,
      `\tif not IsServer() then return end`,
      `\tlocal parent = self:GetParent()`,
      `\tif params.attacker ~= parent or params.unit == parent or params.damage <= 0 then return end`,
      `\tif params.damage_category ~= DOTA_DAMAGE_CATEGORY_SPELL then return end`,
      `\tif bit.band(params.damage_flags, DOTA_DAMAGE_FLAG_NO_SPELL_LIFESTEAL) ~= 0 then return end`,
      `\tif params.unit:IsBuilding() or params.unit:IsOther() then return end`,
      `\tlocal pct = sv(self, "spell_lifesteal")`,
      `\tif not params.unit:IsHero() then pct = pct * 0.2 end -- Dota's usual reduction against creeps`,
      `\tlocal heal = params.damage * pct / 100`,
      `\tparent:HealWithParams(heal, self:GetAbility(), false, true, parent, true)`,
      `\tlocal fx = ParticleManager:CreateParticle("particles/items3_fx/octarine_core_lifesteal.vpcf", PATTACH_ABSORIGIN_FOLLOW, parent)`,
      `\tParticleManager:ReleaseParticleIndex(fx)`,
      `end`);
  }
  if(it.passive&&it.passive.name){
    L.push("",`-- Passive: ${it.passive.name}`); if(it.passive.desc) L.push(`-- ${it.passive.desc.replace(/\n/g," ")}`);
    L.push(`-- TODO: implement with the events declared above`);
  }
  return L.join("\n")+"\n";
}
function buildJSON(){
  // sorted, without timestamps or layout, so a Git diff shows only real balance changes
  const IDS=dotaIds(); const drop=["iconData","updatedAt","createdAt","x","y","example"];
  const sortKeys=o=>Array.isArray(o)?o.map(sortKeys):o&&typeof o==="object"?Object.fromEntries(Object.keys(o).sort().map(k=>[k,sortKeys(o[k])])):o;
  const cfg=Object.assign({},S.config); delete cfg.nodesV;
  const rel = S.viewing==="published"&&latest() ? latest().version : (S.db ? "draft" : "local");
  return JSON.stringify(sortKeys({forge:"fob Item Forge",version:2,release:rel,config:cfg,items:sortedForExport().map(it=>{
    const o=Object.assign({},it); drop.forEach(k=>delete o[k]); o.dotaId=IDS[it.id]; o.fullKey=fullKey(it);
    o.componentKeys=(it.components||[]).map(c=>fullKey(item(c)||{name:"missing"})); return o; })}),null,2)+"\n";
}

async function iconPng(it){

}

      if(prevV!==null && latest() && latest().version!==prevV && !admin) toast(`Items updated to v${latest().version}`,"What changed",openUpdates);
    }
    if(!snap.metadata.fromCache) relSeen=true;
    ready(); redrawDialog();
  }, err=>{ relSeen=true; ready(); });
  if(!admin) return;
  db.collection("items").onSnapshot(snap=>{
    const next={}; snap.docs.forEach(d=>{ next[d.id]=Object.assign({},d.data()); });
    C.items.docs=next;
    if(!snap.metadata.fromCache) S.loaded.items=true;
    ready(); if(dlgKind==="publish") drawPublish();
  }, err=>{ clearTimeout(timer); toast("Lost the connection to the Forge: "+(err.message||err.code)); S.loaded.items=true; ready(); });
  db.doc("config/forge").onSnapshot(s=>{
    const cfg = s.exists ? Object.assign({prefix:"item_fob_",idStart:8000,goldRef:{},goldManual:{},bands:DEFAULT_BANDS},s.data()) : null;
    if(cfg){ if(S.viewing==="published") S.draftCfg=cfg; else S.config=cfg; }
    if(!s.metadata.fromCache) cfgSeen=true;
    ready(); redrawDialog();
  },()=>{ cfgSeen=true; ready(); });
})();
})();
</script>

</body>
